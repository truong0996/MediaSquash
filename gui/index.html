<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Compressor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Main Content -->
    <div class="container">
        <!-- Theme Toggle (Floating) -->
        <button class="theme-btn" id="theme-toggle-btn" title="Theme">💻</button>

        <!-- Top Section: Folders -->
        <div class="glass-panel io-section">
            <div class="input-group">
                <label class="input-label">Source Folder</label>
                <div class="input-wrapper">
                    <input type="text" id="input-folder" class="path-input" placeholder="Select Source..." readonly>
                    <button class="btn-icon-inside" id="btn-input-browse">
                        <span class="icon">📂</span>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Destination Folder</label>
                <div class="input-wrapper">
                    <input type="text" id="output-folder" class="path-input" placeholder="Select Destination..."
                        readonly>
                    <button class="btn-icon-inside" id="btn-output-browse">
                        <span class="icon">📂</span>
                    </button>
                    <!-- Scan button could potentially go here or be separate. Mockup shows it separate. -->
                    <button id="btn-scan" class="btn-icon-inside"
                        style="right: 48px; width: auto; padding: 0 12px; background: var(--accent-blue);">
                        Scan
                    </button>
                </div>
            </div>
        </div>

        <!-- Options Bar -->
        <div class="options-bar">
            <!-- Checkboxes -->
            <label class="checkbox-option">
                <input type="checkbox" id="recursive-scan">
                <div class="custom-check"></div>
                Include subfolders
            </label>
            <label class="checkbox-option">
                <input type="checkbox" id="flatten-output">
                <div class="custom-check"></div>
                Flatten output
            </label>
            <label class="checkbox-option">
                <input type="checkbox" id="rename-only">
                <div class="custom-check"></div>
                Rename only
            </label>
            <label class="checkbox-option">
                <input type="checkbox" id="category-by-year">
                <div class="custom-check"></div>
                Category by year
            </label>

            <!-- File Type Switcher -->
            <div style="flex: 1"></div> <!-- Spacer -->
            <div class="file-type-group">
                <label class="type-radio active">
                    <input type="radio" name="file-type" value="all" checked>
                    All
                </label>
                <label class="type-radio">
                    <input type="radio" name="file-type" value="image">
                    Images only
                </label>
                <label class="type-radio">
                    <input type="radio" name="file-type" value="video">
                    Videos only
                </label>
            </div>
        </div>

        <!-- Settings Grid -->
        <div class="settings-container">
            <!-- Image Settings -->
            <div class="glass-panel settings-card">
                <div class="card-header">
                    <span class="card-icon">🖼️</span> Image Compression Settings
                </div>

                <div class="setting-group">
                    <label class="input-label">Format</label>
                    <div class="preset-tabs">
                        <label class="tab-option">
                            <input type="radio" name="image-format" value="jpeg">
                            <div class="tab-bg"></div>
                            <span class="tab-content">JPEG</span>
                        </label>
                        <label class="tab-option">
                            <input type="radio" name="image-format" value="webp" checked>
                            <div class="tab-bg"></div>
                            <span class="tab-content">WebP</span>
                        </label>
                        <label class="tab-option">
                            <input type="radio" name="image-format" value="avif">
                            <div class="tab-bg"></div>
                            <span class="tab-content">AVIF</span>
                        </label>
                    </div>
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <span>Quality (0-100)</span>
                        <span class="slider-value" id="quality-value">88</span>
                    </div>
                    <input type="range" id="quality-slider" class="range-slider" min="1" max="100" value="88">
                    <span class="slider-hint">Higher = Better Quality</span>
                </div>
            </div>

            <!-- Video Settings -->
            <div class="glass-panel settings-card">
                <div class="card-header">
                    <span class="card-icon">🎬</span> Video Compression Settings
                </div>

                <div class="setting-group">
                    <label class="input-label">Encoder</label>
                    <div class="preset-tabs">
                        <label class="tab-option" id="encoder-nvenc-label">
                            <input type="radio" name="encoder" value="nvenc">
                            <div class="tab-bg"></div>
                            <span class="tab-content">NVENC <span class="badge" id="nvenc-badge">N/A</span></span>
                        </label>
                        <label class="tab-option" id="encoder-amf-label">
                            <input type="radio" name="encoder" value="amf">
                            <div class="tab-bg"></div>
                            <span class="tab-content">AMF <span class="badge" id="amf-badge">...</span></span>
                        </label>
                        <label class="tab-option" id="encoder-qsv-label">
                            <input type="radio" name="encoder" value="qsv">
                            <div class="tab-bg"></div>
                            <span class="tab-content">QSV <span class="badge" id="qsv-badge">N/A</span></span>
                        </label>
                        <label class="tab-option">
                            <input type="radio" name="encoder" value="x264">
                            <div class="tab-bg"></div>
                            <span class="tab-content">x264</span>
                        </label>
                        <label class="tab-option">
                            <input type="radio" name="encoder" value="x265">
                            <div class="tab-bg"></div>
                            <span class="tab-content">x265 <span class="badge"
                                    style="background: #10b981;">HEVC</span></span>
                        </label>
                    </div>
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <span>Quality (CRF 0-51)</span>
                        <span class="slider-value" id="crf-value">22</span>
                    </div>
                    <input type="range" id="crf-slider" class="range-slider" min="0" max="51" value="22">
                    <span class="slider-hint">Lower = Better Quality</span>
                </div>
            </div>
        </div>

        <!-- File List -->
        <div class="glass-panel file-list-section">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 16px 16px;">
                <span
                    style="font-weight: 600; color: var(--text-primary); font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">Files
                    Found</span>
                <span id="file-count" class="badge"
                    style="background: rgba(255, 255, 255, 0.1); color: var(--text-secondary);"></span>
            </div>
            <div class="list-header">
                <div>Name</div>
                <div>Size</div>
                <div>Progress</div>
            </div>

            <div class="list-body" id="file-list">
                <div class="file-list-placeholder">
                    <span>📭 Select folder and click Scan to view files</span>
                </div>
            </div>
        </div>

        <!-- Bottom Actions -->
        <div class="action-area">
            <button class="btn-start" id="btn-start" disabled>
                <span>Start Compression</span>
            </button>

            <!-- Progress Bar (Initially Hidden) -->
            <div id="progress-section" class="total-progress-container">
                <div class="total-progress-fill" id="progress-bar"></div>
                <div class="progress-count" id="progress-count">0/0</div>
                <div class="progress-label" id="progress-text">0%</div>
            </div>

            <button class="btn-start" id="btn-cancel"
                style="display: none; background: var(--accent-danger); width: auto; padding: 0 32px; margin-left: 12px;">
                <span>Stop</span>
            </button>
        </div>

        <!-- Summary Card -->
        <div id="summary-section" class="summary-card">
            <div class="summary-header">
                <span>🎉 Compression Complete!</span>
            </div>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-label">Space Saved</div>
                    <div class="summary-value" id="stat-saved">-</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Time Taken</div>
                    <div class="summary-value time" id="stat-time">-</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Encoder</div>
                    <div class="summary-value encoder" id="stat-encoder">-</div>
                </div>
            </div>
        </div>

    </div>

    <script src="renderer.js"></script>

    <!-- Script to handle UI interactions that CSS can't do (like active class on parent) -->
    <script>
        // Simple script to handle 'active' class on radio labels for File Type
        document.querySelectorAll('input[name="file-type"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('.type-radio').forEach(label => label.classList.remove('active'));
                e.target.closest('.type-radio').classList.add('active');
            });
        });

        // Ensure initial active state
        document.querySelector('input[name="file-type"]:checked')?.closest('.type-radio')?.classList.add('active');
    </script>
</body>

</html>
